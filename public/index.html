<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RQL Construction — HR Contract Manager</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <!-- Header -->
  <header class="header">
    <div class="header-inner">
      <div class="header-brand">
        <svg class="header-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>
          <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
        <div>
          <h1>RQL Construction</h1>
          <p>Employee Contract Management</p>
        </div>
      </div>
      <div class="header-actions">
        <button class="btn btn-outline" id="btn-sync-calendar" title="Sync calendar events for all employees">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
          Sync Calendar
        </button>
        <button class="btn btn-outline" id="btn-run-reminders" title="Manually trigger reminder emails">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 17H2a3 3 0 000 6h20a3 3 0 000-6z"/><path d="M12 3v14"/></svg>
          Send Reminders
        </button>
        <button class="btn btn-primary" id="btn-add-employee">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Add Employee
        </button>
      </div>
    </div>
  </header>

  <!-- Stats Bar -->
  <div class="stats-bar" id="stats-bar">
    <div class="stat-card">
      <div class="stat-value" id="stat-total">—</div>
      <div class="stat-label">Total Employees</div>
    </div>
    <div class="stat-card stat-card--danger">
      <div class="stat-value" id="stat-expired">—</div>
      <div class="stat-label">Expired</div>
    </div>
    <div class="stat-card stat-card--warning">
      <div class="stat-value" id="stat-expiring-soon">—</div>
      <div class="stat-label">Expiring &le; 30 Days</div>
    </div>
    <div class="stat-card stat-card--success">
      <div class="stat-value" id="stat-active">—</div>
      <div class="stat-label">Active</div>
    </div>
  </div>

  <!-- Filter / Search Bar -->
  <div class="toolbar">
    <div class="search-wrap">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" id="search-input" placeholder="Search employees…" />
    </div>
    <div class="filter-group">
      <label>Filter:</label>
      <select id="filter-status">
        <option value="all">All</option>
        <option value="expired">Expired</option>
        <option value="critical">Critical (&le; 7 days)</option>
        <option value="warning">Warning (&le; 30 days)</option>
        <option value="active">Active</option>
      </select>
      <select id="filter-type">
        <option value="all">All Types</option>
        <option value="Full-Time">Full-Time</option>
        <option value="Part-Time">Part-Time</option>
        <option value="Contractor">Contractor</option>
        <option value="Casual">Casual</option>
      </select>
    </div>
  </div>

  <!-- Main Content -->
  <main class="main-content">
    <div id="loading" class="loading-state">
      <div class="spinner"></div>
      <p>Loading employees…</p>
    </div>
    <div id="empty-state" class="empty-state hidden">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg>
      <h3>No employees found</h3>
      <p>Add your first employee to get started</p>
    </div>
    <div class="table-wrap hidden" id="table-wrap">
      <table class="employee-table" id="employee-table">
        <thead>
          <tr>
            <th>Name</th>
            <th>Role</th>
            <th>Type</th>
            <th>Email</th>
            <th>Phone</th>
            <th>Contract Start</th>
            <th>Contract End</th>
            <th>Status</th>
            <th>Missed Days</th>
            <th class="col-actions">Actions</th>
          </tr>
        </thead>
        <tbody id="employee-tbody"></tbody>
      </table>
    </div>
  </main>

  <!-- Add / Edit Modal -->
  <div class="modal-overlay hidden" id="modal-overlay">
    <div class="modal" id="modal">
      <div class="modal-header">
        <h2 id="modal-title">Add Employee</h2>
        <button class="modal-close" id="modal-close">&times;</button>
      </div>
      <form id="employee-form" class="modal-body">
        <input type="hidden" id="form-row-index" />
        <div class="form-grid">
          <div class="form-group">
            <label for="form-name">Full Name <span class="required">*</span></label>
            <input type="text" id="form-name" required placeholder="John Smith" />
          </div>
          <div class="form-group">
            <label for="form-role">Role</label>
            <input type="text" id="form-role" placeholder="Site Manager" />
          </div>
          <div class="form-group">
            <label for="form-type">Employment Type</label>
            <select id="form-type">
              <option value="">— Select —</option>
              <option value="Full-Time">Full-Time</option>
              <option value="Part-Time">Part-Time</option>
              <option value="Contractor">Contractor</option>
              <option value="Casual">Casual</option>
            </select>
          </div>
          <div class="form-group">
            <label for="form-email">Email</label>
            <input type="email" id="form-email" placeholder="john@example.com" />
          </div>
          <div class="form-group">
            <label for="form-phone">Phone</label>
            <input type="tel" id="form-phone" placeholder="+1 416 555 0100" />
          </div>
          <div class="form-group">
            <label for="form-missed">Missed Days</label>
            <input type="number" id="form-missed" min="0" placeholder="0" />
          </div>
          <div class="form-group">
            <label for="form-start">Contract Start</label>
            <input type="date" id="form-start" />
          </div>
          <div class="form-group">
            <label for="form-end">Contract End <span class="required">*</span></label>
            <input type="date" id="form-end" />
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-ghost" id="btn-cancel">Cancel</button>
          <button type="submit" class="btn btn-primary" id="btn-save">Save Employee</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Toast Notifications -->
  <div id="toast-container"></div>

  <script src="/js/app.js"></script>
</body>
</html>
